# wifitester configuration
# Copy to /etc/wifitester/config.toml and fill in psk values.
# Keep real credentials OUT of this repo: use psk_file or chmod 600 the file.

[tester]
interface = "wlan0"            # test radio
# Fast cadence to catch transient outages: sweeps run back-to-back, paced by
# association time (~10-20s per AP visit on one radio).
cycle_interval_s = 5           # min gap after a completed sweep
settle_s = 1.5                 # wait after association for DHCP/route
connect_timeout_s = 15         # nmcli con up timeout (offline APs cost this)
restore_connection = true      # put the radio back on its original network
require_wired_uplink = true    # refuse to run without a non-wifi uplink

[probe]
count = 3                      # gateway pings per visit
interval_s = 0.4
timeout_s = 1.0                # per-ping deadline (transient blips show as loss)
internet_target = "1.1.1.1"    # "" disables the WAN-hop check

[scan]
interval_s = 600               # scan+classify pass cadence (from `run`)
rescan = true                  # force an active scan, not cached results
                               # never | mismatch_only | all
auth_probe = "mismatch_only"
open_assoc = true              # try associating to unknown OPEN networks
auth_timeout_s = 25            # per-BSSID association attempt deadline
# Tip: pin verified BSSIDs in expected_bssids below -- pinned BSSIDs skip
# auth probing and scan passes drop from ~2min to ~15s.

[web]
host = "0.0.0.0"               # status page: http://<pi-ip>:8787
port = 8787

# --- known access points ------------------------------------------------
# expected_bssids: BSSIDs you have verified are yours. They are trusted and
# skip auth probing. Leave empty to auth-probe every BSSID on each scan.

[[ap]]
ssid = "Cisco144454"
psk_file = "/etc/wifitester/psk/cisco144454"
expected_bssids = []           # e.g. ["D4:5D:64:10:43:F8"]

[[ap]]
ssid = "77fast5"
psk_file = "/etc/wifitester/psk/77fast5"
expected_bssids = []

[[ap]]
ssid = "77fast6"
psk_file = "/etc/wifitester/psk/77fast6"
expected_bssids = []

